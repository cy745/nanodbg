[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanodbg"
version = "0.1.0.dev0"
description = "Experimental native debugger for an instrumented iPod nano 7G"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.optional-dependencies]
ble = ["bleak>=0.22", "winrt-Windows.Devices.Bluetooth; sys_platform == 'win32'", "winrt-Windows.Devices.Bluetooth.Advertisement; sys_platform == 'win32'", "winrt-Windows.Storage.Streams; sys_platform == 'win32'"]
fatlab = ["pyfatfs==1.1.0", "setuptools<81"]

[project.scripts]
nanodbg = "nanodbg.__main__:cli"

[tool.setuptools]
packages = ["nanodbg"]
